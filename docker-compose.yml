services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: user_db
    volumes:
      - user-data:/var/lib/postgresql/data

  product-db:
    image: postgres:15-alpine
    container_name: product-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: product_admin
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
      POSTGRES_DB: product_db
    volumes:
      - product-data:/var/lib/postgresql/data

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: order_admin
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: order_db
    volumes:
      - order-data:/var/lib/postgresql/data

  user-service:
    build: ./user-service
    image: ecommerce-user-service:latest
    container_name: user-service
    ports:
      - "3001:3001"
    env_file:
      - ./user-service/.env
    environment:
      PORT: "3001"
      DB_HOST: user-db
      DB_PORT: "5432"
      DB_USERNAME: user_admin
      DB_PASSWORD: ${USER_DB_PASSWORD}
      DB_NAME: user_db
    depends_on:
      - user-db

  product-service:
    build: ./product-service
    image: ecommerce-product-service:latest
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      DB_HOST: product-db
      DB_PORT: "5432"
      DB_USERNAME: product_admin
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      DB_NAME: product_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      - product-db
      - rabbitmq

  order-service:
    build: ./order-service
    image: ecommerce-order-service:latest
    container_name: order-service
    ports:
      - "3003:3003"
    env_file:
      - ./order-service/.env
    environment:
      PORT: "3003"
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_USERNAME: order_admin
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DB_NAME: order_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      - order-db
      - rabbitmq

volumes:
  user-data:
  product-data:
  order-data: